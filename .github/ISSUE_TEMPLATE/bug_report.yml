name: Bug report
description: A component, the CLI or a native view did something it should not have.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component or command
      placeholder: "e.g. Sheet, or ferrule add"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [iOS, Android, Web, Other]
    validations:
      required: true
  - type: input
    id: native
    attributes:
      label: With `native`, or the Ferrule component?
      placeholder: "e.g. native, on iOS 26"
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The harness opens any component directly, so a deep link helps, such as `?component=sheet&mode=dark`.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Ferrule, React Native, Reanimated, and the OS or browser.
      placeholder: "0.1.0, RN 0.88, Reanimated 4.7, iOS 26.5 simulator"
    validations:
      required: true
