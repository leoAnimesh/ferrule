name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Copy components into the apps
        run: pnpm --filter ferrule-example sync
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm check
      - name: Check what each package would ship
        run: pnpm check:pack
      - run: pnpm --filter ferrule-docs test
      - run: pnpm --filter ferrule-docs typecheck
