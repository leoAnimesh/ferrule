buildscript {
  ext.ferruleKotlin = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : (findProperty('android.kotlinVersion') ?: '2.2.0')
  repositories { google(); mavenCentral() }
  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${ferruleKotlin}"
    classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${ferruleKotlin}"
  }
}

apply plugin: 'com.android.library'
if (!plugins.hasPlugin('org.jetbrains.kotlin.android') && !plugins.hasPlugin('com.android.built-in-kotlin')) {
  try { apply plugin: 'org.jetbrains.kotlin.android' } catch (ignored) { /* AGP 9 built-in Kotlin */ }
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.facebook.react'

def safe = { name, fallback -> rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback }

android {
  namespace 'dev.ferrule.nativeui'
  compileSdk safe('compileSdkVersion', 36)
  defaultConfig {
    minSdk safe('minSdkVersion', 24)
    targetSdk safe('targetSdkVersion', 36)
  }
  buildFeatures { compose true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories { google(); mavenCentral() }

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation platform('androidx.compose:compose-bom:2026.09.00')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.material:material-icons-core'
  implementation 'androidx.activity:activity-compose'
}
